name: Update Anak Krakatau Dashboard

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "anak-krakatau-dashboard"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Anak Krakatau scraper
        run: python scraper/scrape_anak_krakatau_2026.py

      - name: Validate generated data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in [Path("data/anak_krakatau_2026.json"), Path("data/impacted_areas.geojson")]:
              if not p.exists(): raise SystemExit(f"Missing: {p}")
              json.loads(p.read_text(encoding="utf-8"))
              print(f"Valid: {p}")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anak_krakatau_2026.json data/impacted_areas.geojson
          if git diff --cached --quiet; then echo "No data changes detected."; else git commit -m "Auto update Anak Krakatau data" && git push; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
